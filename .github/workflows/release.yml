name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Tag matches build.zig.zon
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match build.zig.zon version $version"
            exit 1
          fi
      - run: zig fmt --check build.zig build.zig.zon src tests examples
      - run: sh tools/setup-native.sh
      - run: zig build test bench-test
      - run: zig build test bench-test -Doptimize=ReleaseSafe
      - run: zig build -Doptimize=ReleaseSafe
      - name: Package
        run: |
          name=bifrost-$TAG-linux-x86_64
          mkdir -p "dist/$name"/{bin,lib,config}
          install -m 755 zig-out/bin/bifrost "dist/$name/bin/bifrost"
          cp -P .deps/native/lib/*.so* "dist/$name/lib/"
          cp config/bifrost.toml "dist/$name/config/"
          cp LICENSE NOTICE README.md "dist/$name/"
          printf '#!/bin/sh\ncd "$(dirname "$0")"\nLD_LIBRARY_PATH=$PWD/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH} exec ./bin/bifrost "$@"\n' > "dist/$name/run.sh"
          chmod 755 "dist/$name/run.sh"
          tar -C dist -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Smoke-test the archive
        run: |
          dir=$(mktemp -d)
          tar -xzf "bifrost-$TAG-linux-x86_64.tar.gz" -C "$dir"
          cd "$dir"/bifrost-*
          if LD_LIBRARY_PATH=$PWD/lib ldd bin/bifrost | grep 'not found'; then
            echo "::error::Archive is missing a shared library"
            exit 1
          fi
          ./run.sh > run.log 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            grep -q "Bifrost ready" run.log && break
            kill -0 $pid 2>/dev/null || break
            sleep 0.5
          done
          kill -INT $pid 2>/dev/null || true
          wait $pid || true
          cat run.log
          grep -qF "Starting Bifrost ${TAG#v}" run.log
          grep -q "Bifrost ready" run.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            bifrost-*.tar.gz
            bifrost-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun refreshes the assets and leaves the notes alone
            gh release upload "$TAG" bifrost-*.tar.gz bifrost-*.tar.gz.sha256 --clobber
          elif [[ $TAG == *-* ]]; then
            gh release create "$TAG" bifrost-*.tar.gz bifrost-*.tar.gz.sha256 \
              --verify-tag --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" bifrost-*.tar.gz bifrost-*.tar.gz.sha256 \
              --verify-tag --title "$TAG" --generate-notes --latest
          fi
