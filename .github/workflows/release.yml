name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Builds and checks the archive without publishing it
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # The oldest supported runner, so the archive needs glibc 2.35 at most
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Tag matches build.zig.zon
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.zig.zon version $version"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - run: zig fmt --check build.zig build.zig.zon src tests examples
      # libstdc++ goes into libdatachannel, so the archive doesn't depend on the host's
      - run: LDFLAGS="-static-libstdc++ -static-libgcc" sh tools/setup-native.sh
      - run: zig build test bench-test
      - run: zig build test bench-test -Doptimize=ReleaseSafe
      - run: zig build -Doptimize=ReleaseSafe
      - name: Package
        run: sh tools/package-release.sh "$TAG"
      - name: Smoke-test the archive in clean containers
        run: |
          if ldd .deps/native/lib/libdatachannel.so | grep -q libstdc++; then
            echo "::error::libdatachannel still links libstdc++ dynamically"
            exit 1
          fi
          for image in debian:bookworm-slim ubuntu:22.04; do
            echo "::group::$image"
            docker run --rm -v "$PWD/dist/bifrost-$TAG-linux-x86_64.tar.gz:/bifrost.tar.gz:ro" -e VERSION="${TAG#v}" "$image" sh -ec '
              tar -xzf /bifrost.tar.gz -C /opt
              cd /opt/bifrost-*
              ./run.sh > run.log 2>&1 &
              pid=$!
              for _ in $(seq 60); do
                grep -q "Bifrost ready" run.log && break
                kill -0 $pid 2>/dev/null || break
                sleep 0.5
              done
              kill -TERM $pid 2>/dev/null || true
              wait $pid || true
              cat run.log
              grep -qF "Starting Bifrost $VERSION" run.log
              grep -q "Bifrost ready" run.log
              grep -q "Stopped after" run.log
              test -f licenses/libdatachannel/LICENSE && test -f licenses/mbedtls/LICENSE && test -f licenses/zio/LICENSE'
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/bifrost-*.tar.gz
            dist/bifrost-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun refreshes the assets and leaves the notes alone
            gh release upload "$TAG" bifrost-*.tar.gz bifrost-*.tar.gz.sha256 --clobber
          elif [[ $TAG == *-* ]]; then
            gh release create "$TAG" bifrost-*.tar.gz bifrost-*.tar.gz.sha256 \
              --verify-tag --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" bifrost-*.tar.gz bifrost-*.tar.gz.sha256 \
              --verify-tag --title "$TAG" --generate-notes --latest
          fi
